<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>ECHORIS Palette Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0A0A0A; color: #C0C0C0; font-family: 'Inter', sans-serif;
  font-weight: 300; font-size: 13px; cursor: crosshair;
  display: flex; flex-direction: column; height: 100vh; overflow: hidden;
}
/* ── Layout ── */
.toolbar {
  display: flex; gap: 12px; padding: 8px 12px; background: #101014;
  border-bottom: 1px solid #1A3A3A; align-items: center; flex-shrink: 0;
  flex-wrap: wrap;
}
.toolbar label { font-family: 'Rajdhani', sans-serif; font-weight: 600; color: #4A8A8A; text-transform: uppercase; font-size: 11px; letter-spacing: .5px; }
.toolbar input[type="file"] { display: none; }
.toolbar .btn {
  background: none; border: 1px solid #1A3A3A; color: #C0C0C0; padding: 4px 12px;
  font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 12px;
  text-transform: uppercase; cursor: pointer; letter-spacing: .5px;
}
.toolbar .btn:hover { border-color: #E87830; color: #E87830; }
.toolbar .btn.primary { border-color: #E87830; color: #E87830; }
.toolbar select {
  background: #0A0A0A; border: 1px solid #1A3A3A; color: #E87830;
  font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 12px;
  padding: 4px 8px; cursor: pointer; min-width: 160px;
}
.toolbar select:hover { border-color: #E87830; }
.toolbar select option { background: #101014; color: #C0C0C0; }
.main { display: flex; flex: 1; overflow: hidden; }
/* ── Content: left preview + right controls ── */
.preview-pane {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 16px; overflow: auto; min-width: 0;
}
.controls-pane {
  width: 380px; flex-shrink: 0; overflow-y: auto; padding: 12px;
  border-left: 1px solid #1A3A3A; background: #0D0D10;
  display: flex; flex-direction: column; gap: 12px;
}
.section-label {
  font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 11px;
  color: #4A8A8A; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px;
}
/* ── Preview ── */
.preview-wrap {
  background: #101014; border: 1px solid #1A3A3A; padding: 8px; display: inline-block;
}
.preview-wrap canvas { display: block; image-rendering: pixelated; }
/* ── Gradient strip ── */
.gradient-section { background: #101014; border: 1px solid #1A3A3A; padding: 12px; }
.gradient-bar { height: 32px; width: 100%; margin-bottom: 8px; image-rendering: pixelated; }
.stops-list { display: flex; flex-direction: column; gap: 4px; }
.stop-row {
  display: flex; align-items: center; gap: 8px; padding: 4px;
  border: 1px solid transparent;
}
.stop-row:hover { border-color: #1A3A3A; }
.stop-row input[type="color"] {
  width: 28px; height: 22px; border: 1px solid #1A3A3A; background: #0A0A0A;
  cursor: pointer; padding: 0;
}
.stop-row input[type="range"] { flex: 1; max-width: 120px; accent-color: #E87830; }
.stop-row .hex-val {
  font-family: 'Rajdhani', sans-serif; font-size: 12px; color: #C0C0C0;
  width: 60px; background: #0A0A0A; border: 1px solid #1A3A3A; padding: 2px 4px;
  text-align: center;
}
.stop-row .t-val {
  font-family: 'Rajdhani', sans-serif; font-size: 11px; color: #4A8A8A; width: 36px;
  text-align: right;
}
.stop-row .btn-del {
  background: none; border: none; color: #3A3A48; cursor: pointer;
  font-size: 14px; line-height: 1;
}
.stop-row .btn-del:hover { color: #E87830; }
.btn-add-stop {
  background: none; border: 1px dashed #1A3A3A; color: #4A8A8A; padding: 4px 12px;
  font-family: 'Rajdhani', sans-serif; font-size: 11px; cursor: pointer;
  text-transform: uppercase; margin-top: 4px;
}
.btn-add-stop:hover { border-color: #E87830; color: #E87830; }
/* ── Params ── */
.params-section { background: #101014; border: 1px solid #1A3A3A; padding: 12px; }
.param-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.param-row label {
  font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 11px;
  color: #4A8A8A; width: 90px; text-transform: uppercase;
}
.param-row input[type="range"] { flex: 1; max-width: 200px; accent-color: #E87830; }
.param-row input[type="color"] {
  width: 28px; height: 22px; border: 1px solid #1A3A3A; background: #0A0A0A;
  cursor: pointer; padding: 0;
}
.param-row .param-val {
  font-family: 'Rajdhani', sans-serif; font-size: 12px; color: #C0C0C0; width: 60px;
}
.param-row input[type="text"].param-text {
  font-family: 'Rajdhani', sans-serif; font-size: 12px; color: #C0C0C0;
  background: #0A0A0A; border: 1px solid #1A3A3A; padding: 2px 6px;
  width: 140px;
}
.param-row input[type="text"].param-text:focus { border-color: #E87830; outline: none; }
/* ── Collapsible parallax ── */
.parallax-section { background: #101014; border: 1px solid #1A3A3A; padding: 0; }
.parallax-header {
  display: flex; align-items: center; gap: 6px; padding: 8px 12px; cursor: pointer;
  user-select: none;
}
.parallax-header:hover { background: #14141a; }
.parallax-header .chevron {
  font-family: 'Rajdhani', sans-serif; font-size: 10px; color: #3A3A48;
  transition: transform .15s;
}
.parallax-header.open .chevron { transform: rotate(90deg); }
.parallax-body { padding: 0 12px 12px; display: none; }
.parallax-body.open { display: block; }
/* ── Tint swatch inline ── */
.tint-swatch {
  display: inline-block; width: 12px; height: 12px; border: 1px solid #1A3A3A;
  vertical-align: middle; margin-left: 4px;
}
/* ── Drop overlay ── */
.drop-overlay {
  position: fixed; inset: 0; background: rgba(10,10,10,.9);
  display: none; align-items: center; justify-content: center; z-index: 100;
  border: 2px dashed #E87830;
}
.drop-overlay.active { display: flex; }
.drop-overlay span { font-family: 'Rajdhani', sans-serif; font-size: 24px; color: #E87830; }
/* ── Status ── */
.status { font-family: 'Rajdhani', sans-serif; font-size: 11px; color: #3A3A48; padding: 0 12px; }
.status.ok { color: #4A8A8A; }
/* ── Scrollbar ── */
.controls-pane::-webkit-scrollbar { width: 6px; }
.controls-pane::-webkit-scrollbar-track { background: #0A0A0A; }
.controls-pane::-webkit-scrollbar-thumb { background: #1A3A3A; border-radius: 3px; }
.controls-pane::-webkit-scrollbar-thumb:hover { background: #2A4A4A; }
</style>
</head>

<div class="toolbar">

  <label>LDtk<input type="file" id="ldtkInput" accept=".ldtk,.json,application/json"></label>

  <select id="levelSelect" onchange="selectPreviewLevel(this.value)">

  <div style="flex:1"></div>

</div>

// ── Palette math (mirrors PaletteSwapFilter.ts) ──
function lerp(a, b, t) { return a + (b - a) * t; }
function unpack(rgb) { return [(rgb >> 16) & 0xff, (rgb >> 8) & 0xff, rgb & 0xff]; }
function packHex(r, g, b) {
  return '#' + [r, g, b].map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
}
function hexToInput(n) { return '#' + (n & 0xffffff).toString(16).padStart(6, '0'); }
function sampleRow(stops, t) {
  const s = [...stops].sort((a, b) => a.t - b.t);
  if (s.length === 0) return [0, 0, 0];
  if (t <= s[0].t) return unpack(s[0].color);
  if (t >= s[s.length - 1].t) return unpack(s[s.length - 1].color);
  for (let i = 0; i < s.length - 1; i++) {
    if (t >= s[i].t && t <= s[i + 1].t) {
      const lt = (t - s[i].t) / Math.max(s[i + 1].t - s[i].t, 1e-6);
      const [ar, ag, ab] = unpack(s[i].color);
      const [br, bg, bb] = unpack(s[i + 1].color);
      return [lerp(ar, br, lt), lerp(ag, bg, lt), lerp(ab, bb, lt)];
    }
  }
  return unpack(s[s.length - 1].color);
}

function buildLUT(stops) {
  const lut = new Uint8Array(256 * 3);
  for (let x = 0; x < 256; x++) {
    const t = x / 255;
    const [r, g, b] = sampleRow(stops, t);
    lut[x * 3] = Math.round(r);
    lut[x * 3 + 1] = Math.round(g);
    lut[x * 3 + 2] = Math.round(b);
  }
  return lut;
}

// ── CSV parsing (all 16 columns) ──
function splitCsvLine(line) {
  const cols = []; let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { inQ = !inQ; continue; }
    if (c === ',' && !inQ) { cols.push(cur); cur = ''; continue; }
    cur += c;
  }
  cols.push(cur);
  return cols;
}

  const stops = [];
  for (const pair of (raw || '').split('|')) {
    const [tStr, hexStr] = pair.split(':');
    if (!tStr || !hexStr) continue;
    stops.push({ t: parseFloat(tStr), color: parseHex(hexStr) });
  }
  return stops;
}

function loadCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  csvHeader = lines[0];
  csvEntries = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = splitCsvLine(lines[i]);
    if (cols.length < 9) continue;
    csvEntries.push({
      id:              cols[0].trim(),
      name:            cols[1].trim(),
      layer:           cols[2].trim().toUpperCase(),
      brightness:      parseFloat(cols[3]) || 1.0,
      tint:            parseHex(cols[4]) || 0xffffff,
      depthBias:       parseFloat(cols[5]) || 0,
      depthCenter:     parseFloat(cols[6]) || 0.5,
      stops:           parseStops(cols[7]),
      description:     (cols[8] ?? '').trim(),
      tileset:         (cols[9] ?? '').trim(),
      parallaxImage:   (cols[10] ?? '').trim(),
      parallaxFactor:  (cols[11] ?? '').trim(),
      parallaxImageMid:(cols[12] ?? '').trim(),
      parallaxFactorMid:(cols[13] ?? '').trim(),
      parallaxImageNear:(cols[14] ?? '').trim(),
      parallaxFactorNear:(cols[15] ?? '').trim(),
    });
  }
  buildSidebar();
  status('CSV loaded: ' + csvEntries.length + ' entries', true);
}

// ── CSV export (all 16 columns) ──
function stopsToString(stops) {
  return [...stops].sort((a, b) => a.t - b.t)
    .map(s => s.t.toFixed(2) + ':' + (s.color & 0xffffff).toString(16).padStart(6, '0'))
    .join('|');
}
function quoteCsv(s) {
  if (typeof s !== 'string') return s;
  if (s.includes(',') || s.includes('"') || s.includes('\n')) {
    return '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}
function entriesToCSV() {
  let out = csvHeader + '\n';
  for (const e of csvEntries) {
    out += [
      e.id, quoteCsv(e.name), e.layer, e.brightness.toFixed(2),
      '0x' + (e.tint & 0xffffff).toString(16).padStart(6, '0').toUpperCase(),
      e.depthBias.toFixed(2), e.depthCenter.toFixed(2),
      stopsToString(e.stops), quoteCsv(e.description), e.tileset,
      e.parallaxImage, e.parallaxFactor,
      e.parallaxImageMid, e.parallaxFactorMid,
      e.parallaxImageNear, e.parallaxFactorNear,

}

  renderPreview();
}

function renderGradientSection(entry, label) {

  html += '<canvas class="gradient-bar" id="gradBar_' + label + '" width="512" height="32"></canvas>';

    html += '<div class="stop-row" data-layer="' + label + '" data-idx="' + i + '">';
    html += '<input type="color" value="' + hex + '" data-field="color">';
    html += '<input type="range" min="0" max="1" step="0.01" value="' + s.t.toFixed(2) + '" data-field="t">';
    html += '<span class="t-val">' + s.t.toFixed(2) + '</span>';
    html += '<input class="hex-val" type="text" value="' + hex.slice(1) + '" data-field="hextext">';
    html += '<button class="btn-del" data-field="del">x</button>';
    html += '</div>';
  });
  html += '</div>';
  html += '<button class="btn-add-stop" data-layer="' + label + '">+ Add Stop</button>';

  // Params section with Tint picker
  html += '<div class="params-section" style="margin-top:8px">';
  html += paramRow(label, 'Brightness', 'brightness', entry.brightness, 0.5, 2.0, 0.01);
  html += paramRow(label, 'DepthBias', 'depthBias', entry.depthBias, 0, 1.0, 0.01);
  html += paramRow(label, 'DepthCenter', 'depthCenter', entry.depthCenter, 0, 1.0, 0.01);
  // Tint color picker
  html += '<div class="param-row">';
  html += '<label>Tint</label>';
  html += '<input type="color" value="' + hexToInput(entry.tint) + '" data-layer="' + label + '" data-tint="color">';
  html += '<input type="text" class="param-text" value="' + hexToInput(entry.tint).slice(1).toUpperCase() + '" data-layer="' + label + '" data-tint="hex">';
  html += '</div>';
  // Tileset (read-only display)
  if (entry.tileset) {
    html += '<div class="param-row">';
    html += '<label>Tileset</label>';
    html += '<span class="param-val" style="width:auto;color:#E87830">' + entry.tileset + '</span>';
    html += '</div>';
  }
  // Description (editable)
  const descSafe = (entry.description || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;');
  html += '<div class="param-row" style="align-items:flex-start">';
  html += '<label style="padding-top:4px">Desc</label>';
  html += '<textarea class="param-text" style="width:100%;min-height:48px;resize:vertical;font-family:Inter,sans-serif;font-size:11px;line-height:1.4" data-layer="' + label + '" data-desc="text">' + descSafe + '</textarea>';
  html += '</div>';

  if (entry.parallaxImage || entry.parallaxImageMid || entry.parallaxImageNear) {
    html += renderParallaxSection(entry, label);
  }

  html += '</div>';
  return html;
}

function renderParallaxSection(entry, label) {

  html += '<div class="parallax-body" id="' + uid + '_body">';

    { lbl: 'Far',  imgField: 'parallaxImage',     factField: 'parallaxFactor' },

    { lbl: 'Near', imgField: 'parallaxImageNear', factField: 'parallaxFactorNear' },

function bindStopEvents() {
  // Gradient stop color/t changes
  document.querySelectorAll('.stop-row').forEach(row => {
    const layer = row.dataset.layer;
    const idx = parseInt(row.dataset.idx);
    const entry = findEntry(selectedPairId, layer);
    if (!entry) return;

    row.querySelector('[data-field="color"]').addEventListener('input', e => {
      const hex = e.target.value;
      entry.stops[idx].color = parseInt(hex.slice(1), 16);
      row.querySelector('[data-field="hextext"]').value = hex.slice(1);
      scheduleUpdate();
    });
    row.querySelector('[data-field="t"]').addEventListener('input', e => {
      entry.stops[idx].t = parseFloat(e.target.value);
      row.querySelector('.t-val').textContent = entry.stops[idx].t.toFixed(2);
      scheduleUpdate();
    });
    row.querySelector('[data-field="hextext"]').addEventListener('change', e => {
      const val = e.target.value.replace(/^#/, '');
      if (/^[0-9a-f]{6}$/i.test(val)) {
        entry.stops[idx].color = parseInt(val, 16);
        row.querySelector('[data-field="color"]').value = '#' + val;
        scheduleUpdate();
      }
    });
    row.querySelector('[data-field="del"]').addEventListener('click', () => {
      if (entry.stops.length <= 2) return;
      entry.stops.splice(idx, 1);
      renderEditor();
    });
  });

  // Add stop
  document.querySelectorAll('.btn-add-stop').forEach(btn => {
    btn.addEventListener('click', () => {
      const layer = btn.dataset.layer;
      const entry = findEntry(selectedPairId, layer);
      if (!entry) return;
      entry.stops.push({ t: 0.5, color: 0x808080 });
      entry.stops.sort((a, b) => a.t - b.t);
      renderEditor();
    });
  });

  // Param sliders
  document.querySelectorAll('[data-param]').forEach(slider => {
    slider.addEventListener('input', e => {
      const layer = e.target.dataset.layer;
      const param = e.target.dataset.param;
      const entry = findEntry(selectedPairId, layer);
      if (!entry) return;
      entry[param] = parseFloat(e.target.value);
      e.target.nextElementSibling.textContent = entry[param].toFixed(2);
      scheduleUpdate();
    });
  });

  // Tint color pickers
  document.querySelectorAll('[data-tint="color"]').forEach(picker => {
    picker.addEventListener('input', e => {
      const layer = e.target.dataset.layer;
      const entry = findEntry(selectedPairId, layer);
      if (!entry) return;
      entry.tint = parseInt(e.target.value.slice(1), 16);
      const hexInput = e.target.parentElement.querySelector('[data-tint="hex"]');
      if (hexInput) hexInput.value = e.target.value.slice(1).toUpperCase();
      scheduleUpdate();
    });
  });
  document.querySelectorAll('[data-tint="hex"]').forEach(input => {
    input.addEventListener('change', e => {
      const val = e.target.value.replace(/^#/, '');
      if (!/^[0-9a-f]{6}$/i.test(val)) return;
      const layer = e.target.dataset.layer;
      const entry = findEntry(selectedPairId, layer);
      if (!entry) return;
      entry.tint = parseInt(val, 16);
      const picker = e.target.parentElement.querySelector('[data-tint="color"]');
      if (picker) picker.value = '#' + val.toLowerCase();
      scheduleUpdate();
    });
  });

  // Parallax text fields
  document.querySelectorAll('[data-plx-field]').forEach(input => {
    input.addEventListener('change', e => {
      const layer = e.target.dataset.layer;
      const field = e.target.dataset.plxField;
      const entry = findEntry(selectedPairId, layer);
      if (!entry) return;
      entry[field] = e.target.value.trim();
    });
  });

  // Description textarea
  document.querySelectorAll('[data-desc="text"]').forEach(input => {
    input.addEventListener('input', e => {
      const layer = e.target.dataset.layer;
      const entry = findEntry(selectedPairId, layer);
      if (!entry) return;
      entry.description = e.target.value;
    });
  });

  renderGradientBars();
}

let _updateTimer = null;
function scheduleUpdate() {
  if (_updateTimer) cancelAnimationFrame(_updateTimer);
  _updateTimer = requestAnimationFrame(() => {
    renderGradientBars();
    renderPreview();
  });
}

function renderGradientBars() {
  for (const layer of ['BG', 'WALL']) {
    const canvas = document.getElementById('gradBar_' + layer);
    if (!canvas) continue;
    const entry = findEntry(selectedPairId, layer);
    if (!entry) continue;
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    const img = ctx.createImageData(w, h);
    for (let x = 0; x < w; x++) {
      const t = x / (w - 1);
      const [r, g, b] = sampleRow(entry.stops, t);
      for (let y = 0; y < h; y++) {
        const i = (y * w + x) * 4;
        img.data[i] = Math.round(r);
        img.data[i + 1] = Math.round(g);
        img.data[i + 2] = Math.round(b);
        img.data[i + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }
}

function renderPreview() {
  const canvas = document.getElementById('previewCanvas');
  if (!canvas) return;
  const map = currentPreviewMap();
  if (canvas.width !== map.w) canvas.width = map.w;
  if (canvas.height !== map.h) canvas.height = map.h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, map.w, map.h);

  const bgEntry = findEntry(selectedPairId, 'BG');
  const wallEntry = findEntry(selectedPairId, 'WALL');

  if (bgEntry) renderBackgroundGradient(ctx, bgEntry, map);
  if (wallEntry) renderPaletteLayer(ctx, map.wallTiles, wallTilesetImg, wallEntry, map);

  ctx.font = '10px Rajdhani, sans-serif';
  ctx.fillStyle = '#4A8A8A';
  ctx.fillText('BG:' + (bgEntry ? 'OK' : 'NONE') +
    '  WALL:' + (wallEntry ? 'OK' : 'NONE') + (wallTilesetImg ? '+TEX:' + wallTilesetName : '') +
    '  MAP:' + map.label, 4, map.h - 4);
}

function renderBackgroundGradient(ctx, entry, map) {
  const lut = buildLUT(entry.stops);
  const brightness = entry.brightness;
  const depthBias = entry.depthBias;
  const depthCenter = entry.depthCenter;
  const tintR = ((entry.tint >> 16) & 0xff) / 255;
  const tintG = ((entry.tint >> 8) & 0xff) / 255;
  const tintB = (entry.tint & 0xff) / 255;

  const img = ctx.createImageData(map.w, map.h);
  for (let y = 0; y < map.h; y++) {
    const screenY = (y + 0.5) / map.h;
    const depthShift = (screenY - depthCenter) * depthBias;
    const biased = Math.max(0, Math.min(1, 0.5 + depthShift));
    const idx = Math.round(biased * 255) * 3;
    const r = Math.min(255, lut[idx] * brightness * tintR);
    const g = Math.min(255, lut[idx + 1] * brightness * tintG);
    const b = Math.min(255, lut[idx + 2] * brightness * tintB);
    for (let x = 0; x < map.w; x++) {
      const i = (y * map.w + x) * 4;
      img.data[i] = r;
      img.data[i + 1] = g;
      img.data[i + 2] = b;
      img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
}

function renderPaletteLayer(ctx, tiles, tilesetImg, entry, map) {
  const lut = buildLUT(entry.stops);
  const brightness = entry.brightness;
  const depthBias = entry.depthBias;
  const depthCenter = entry.depthCenter;
  const tintR = ((entry.tint >> 16) & 0xff) / 255;
  const tintG = ((entry.tint >> 8) & 0xff) / 255;
  const tintB = (entry.tint & 0xff) / 255;

  function samplePalette(luma, screenY) {
    const depthShift = (screenY - depthCenter) * depthBias;
    const biased = Math.max(0, Math.min(1, luma + depthShift));
    const idx = Math.round(biased * 255) * 3;
    return [
      Math.min(255, lut[idx] * brightness * tintR),
      Math.min(255, lut[idx + 1] * brightness * tintG),
      Math.min(255, lut[idx + 2] * brightness * tintB)
    ];
  }

  if (!tilesetImg) {
    for (const tile of tiles) {
      const x0 = tile.px[0];
      const y0 = tile.px[1];
      for (let yy = 0; yy < map.tile; yy++) {
        const y = y0 + yy;
        const screenY = (y + 0.5) / map.h;
        const [r, g, b] = samplePalette(0.5, screenY);
        ctx.fillStyle = packHex(r, g, b);
        ctx.fillRect(x0, y, map.tile, 1);
      }
    }
    return;
  }

  try {
    const off = document.createElement('canvas');
    off.width = map.w; off.height = map.h;
    const offCtx = off.getContext('2d');
    offCtx.fillStyle = '#808080';
    for (const tile of tiles) offCtx.fillRect(tile.px[0], tile.px[1], map.tile, map.tile);
    for (const tile of tiles) {
      if (tile.synth) continue;
      offCtx.save();
      const fx = (tile.f & 1) ? -1 : 1;
      const fy = (tile.f & 2) ? -1 : 1;
      offCtx.translate(tile.px[0] + (fx < 0 ? map.tile : 0), tile.px[1] + (fy < 0 ? map.tile : 0));
      offCtx.scale(fx, fy);
      offCtx.drawImage(tilesetImg, tile.src[0], tile.src[1], map.tile, map.tile, 0, 0, map.tile, map.tile);
      offCtx.restore();
    }
    const imgData = offCtx.getImageData(0, 0, map.w, map.h);
    const d = imgData.data;
    for (let y = 0; y < map.h; y++) {
      const screenY = y / map.h;
      for (let x = 0; x < map.w; x++) {
        const i = (y * map.w + x) * 4;
        if (d[i + 3] === 0) continue;
        const luma = (d[i] * 0.2126 + d[i + 1] * 0.7152 + d[i + 2] * 0.0722) / 255;
        const [r, g, b] = samplePalette(luma, screenY);
        d[i] = r; d[i + 1] = g; d[i + 2] = b;
      }
    }
    offCtx.putImageData(imgData, 0, 0);
    ctx.drawImage(off, 0, 0);
  } catch (e) {
    console.error('[palette-editor] renderPaletteLayer failed:', e);
    for (const tile of tiles) {
      const x0 = tile.px[0];
      const y0 = tile.px[1];
      for (let yy = 0; yy < map.tile; yy++) {
        const y = y0 + yy;
        const screenY = (y + 0.5) / map.h;
        const [r, g, b] = samplePalette(0.5, screenY);
        ctx.fillStyle = packHex(r, g, b);
        ctx.fillRect(x0, y, map.tile, 1);
      }
    }
  }
}

function loadImageFromBlob(blob) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = URL.createObjectURL(blob);
  });
}

function loadImageFromSrc(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function loadImageFromFile(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      resolve(img);
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('Image load failed: ' + file.name));
    };
    img.src = url;
  });
}

function normalizeTile(tile, fallbackTileSize) {
  return {
    px: tile.px || [0, 0],
    src: tile.src || [0, 0],
    f: tile.f || 0,
    synth: !!tile.synth,
    tileSize: fallbackTileSize,
  };
}

function findPreviewIntGridLayer(level) {
  const layers = level.layerInstances || [];
  return layers.find(li => li.__identifier === 'Collisions' && li.__type === 'IntGrid' && li.intGridCsv) ||
    layers.find(li => li.__type === 'IntGrid' && li.intGridCsv);
}

function solidGridFromIntGrid(layer, tileSize) {
  const gridW = layer.__cWid || 0;
  const gridH = layer.__cHei || 0;
  const solid = new Uint8Array(gridW * gridH);
  const csv = layer.intGridCsv || [];
  for (let i = 0; i < Math.min(csv.length, solid.length); i++) {
    if (csv[i]) solid[i] = 1;
  }
  for (const tile of layer.autoLayerTiles || []) {
    const x = Math.floor((tile.px?.[0] || 0) / tileSize);
    const y = Math.floor((tile.px?.[1] || 0) / tileSize);
    if (x >= 0 && y >= 0 && x < gridW && y < gridH) solid[y * gridW + x] = 1;
  }
  return { solid, gridW, gridH };
}

function buildSyntheticBgTiles(solid, gridW, gridH, tileSize) {
  const tiles = [];
  for (let y = 0; y < gridH; y++) {
    let first = -1;
    let last = -1;
    for (let x = 0; x < gridW; x++) {
      if (!solid[y * gridW + x]) continue;
      if (first < 0) first = x;
      last = x;
    }
    if (first < 0 || last - first < 2) continue;
    for (let x = first + 1; x < last; x++) {
      if (solid[y * gridW + x]) continue;
      tiles.push({ px: [x * tileSize, y * tileSize], src: [0, 0], f: 0, synth: true });
    }
  }
  return tiles;
}

function buildSolidFallbackTiles(solid, gridW, gridH, tileSize) {
  const tiles = [];
  for (let y = 0; y < gridH; y++) {
    for (let x = 0; x < gridW; x++) {
      if (!solid[y * gridW + x]) continue;
      tiles.push({ px: [x * tileSize, y * tileSize], src: [0, 0], f: 0, synth: true });
    }
  }
  return tiles;
}

function buildPreviewMapFromLevel(worldName, level, layer) {
  const tileSize = layer.__gridSize || 16;
  const { solid, gridW, gridH } = solidGridFromIntGrid(layer, tileSize);
  const autoTiles = (layer.autoLayerTiles || []).map(t => normalizeTile(t, tileSize));
  return {
    key: worldName + '/' + level.identifier,
    world: worldName,
    level: level.identifier,
    label: worldName + '/' + level.identifier,
    w: level.pxWid || gridW * tileSize,
    h: level.pxHei || gridH * tileSize,
    tile: tileSize,
    wallTilesetName: tilesetNameFromRelPath(layer.__tilesetRelPath),
    bgTiles: buildSyntheticBgTiles(solid, gridW, gridH, tileSize),
    wallTiles: autoTiles.length > 0 ? autoTiles : buildSolidFallbackTiles(solid, gridW, gridH, tileSize),
  };
}

function extractPreviewMapsFromLdtk(ldtk) {
  const worldEntries = (ldtk.worlds && ldtk.worlds.length > 0)
    ? ldtk.worlds.map(w => ({ name: w.identifier || 'World', levels: w.levels || [] }))
    : [{ name: 'World', levels: ldtk.levels || [] }];
  const maps = [];
  for (const world of worldEntries) {
    for (const level of world.levels) {
      const layer = findPreviewIntGridLayer(level);
      if (!layer) continue;
      const nonZero = (layer.intGridCsv || []).some(v => !!v);
      if (!nonZero && !(layer.autoLayerTiles || []).length) continue;
      maps.push(buildPreviewMapFromLevel(world.name, level, layer));
    }
  }
  return maps;
}

function loadLdtk(text, sourceLabel) {
  let data;
  try {
    data = JSON.parse(text);
  } catch (e) {
    status('LDtk load failed: invalid JSON', false);
    return false;
  }
  const previousKey = previewMap ? previewMap.key : '';
  const maps = extractPreviewMapsFromLdtk(data);
  if (maps.length === 0) {
    status('LDtk load failed: no IntGrid levels found', false);
    return false;
  }
  ldtkPreviewMaps = maps;
  previewMap = pickDefaultPreviewMap(maps, previousKey);
  if (previewMap && isAllowedWallTileset(previewMap.wallTilesetName)) wallTilesetName = previewMap.wallTilesetName;
  populateWallTilesetSelect();
  populateLevelSelect();
  if (selectedPairId) renderEditor();
  selectWallTileset(wallTilesetName, { quiet: true });
  status('LDtk loaded from ' + sourceLabel + ': ' + maps.length + ' IntGrid levels', true);
  return true;
}

async function tryFetchCsvFromDisk(bustCache) {
  if (location.protocol === 'file:') return null;
  try {
    const url = CSV_DISK_PATH + (bustCache ? '?_=' + Date.now() : '');
    const res = await fetch(url);
    if (!res.ok) return null;
    return await res.text();
  } catch (e) { return null; }
}

async function tryFetchLdtkFromDisk(bustCache) {
  if (location.protocol === 'file:') return null;
  for (const path of LDTK_DISK_PATHS) {
    try {
      const url = path + (bustCache ? '?_=' + Date.now() : '');
      const res = await fetch(url);
      if (!res.ok) continue;
      return await res.text();
    } catch (e) {
      // Try the next path. file:// cannot fetch relative project files.
    }
  }
  return null;
}

async function tryFetchTilesetFromDisk(name) {
  if (!name) return null;
  if (location.protocol === 'file:') return null;
  const fileName = tilesetFileFromName(name);
  for (const dir of ATLAS_DISK_DIRS) {
    try {
      const res = await fetch(dir + fileName);
      if (!res.ok) continue;
      const blob = await res.blob();
      return await loadImageFromBlob(blob);
    } catch (e) {
      // Try the next path.
    }
  }
  return null;
}

function preferredWallTilesetName() {
  if (previewMap && isAllowedWallTileset(previewMap.wallTilesetName)) return previewMap.wallTilesetName;
  if (isAllowedWallTileset(wallTilesetName)) return wallTilesetName;
  const wallEntry = selectedPairId ? findEntry(selectedPairId, 'WALL') : null;
  if (wallEntry && isAllowedWallTileset(wallEntry.tileset)) return wallEntry.tileset;
  return tilesetNameFromFile(wallTilesetOptions[0]);
}

async function selectWallTileset(name, opts = {}) {
  const nextName = tilesetNameFromFile(name);
  if (!isAllowedWallTileset(nextName)) {
    if (!opts.quiet) status('WALL tileset rejected: only atlas 256x256 PNGs are allowed', false);
    return false;
  }

  wallTilesetName = nextName;
  try { localStorage.setItem(LS_WALL_NAME, wallTilesetName); } catch(e) {}
  const sel = document.getElementById('wallTilesetSelect');
  if (sel && sel.value !== wallTilesetName) sel.value = wallTilesetName;

  const cached = wallTilesetCache.get(wallTilesetName);
  if (cached) {
    wallTilesetImg = cached;
    renderPreview();
    if (!opts.quiet) status('WALL tileset: ' + tilesetFileFromName(wallTilesetName), true);
    return true;
  }

  const img = await tryFetchTilesetFromDisk(wallTilesetName);
  if (wallTilesetName !== nextName) return false;
  wallTilesetImg = img;
  renderPreview();
  if (!opts.quiet) {
    status(img
      ? 'WALL tileset: ' + tilesetFileFromName(wallTilesetName)
      : 'WALL tileset selected; use Load Atlas PNGs on file:// to texture it', !!img);
  }
  return !!img;
}

async function autoLoadWallTilesetFromDisk() {
  populateWallTilesetSelect();
  const before = wallTilesetImg;
  await selectWallTileset(preferredWallTilesetName(), { quiet: true });
  return wallTilesetImg && wallTilesetImg !== before ? 1 : 0;
}

async function loadEmbeddedWallTilesets() {
  const embedded = window.PALETTE_EDITOR_EMBEDDED && window.PALETTE_EDITOR_EMBEDDED.wallTilesets;
  if (!embedded) return 0;

  let loaded = 0;
  const files = [];
  for (const [name, src] of Object.entries(embedded)) {
    try {
      const img = await loadImageFromSrc(src);
      if (img.width !== 256 || img.height !== 256) continue;
      wallTilesetCache.set(name, img);
      files.push(tilesetFileFromName(name));
      loaded++;
    } catch (e) {
      console.warn('[palette-editor] embedded atlas load failed:', name, e);
    }
  }

  if (files.length > 0) {
    wallTilesetOptions = sortTilesetFiles(files);
    populateWallTilesetSelect();
    const embeddedMap = embeddedPreviewMap();
    if (embeddedMap && isAllowedWallTileset(embeddedMap.wallTilesetName)) {
      wallTilesetName = embeddedMap.wallTilesetName;
    }
    await selectWallTileset(preferredWallTilesetName(), { quiet: true });
  }
  return loaded;
}

function isTopLevelAtlasFile(file) {
  const rel = file.webkitRelativePath || '';
  return !rel || rel.split('/').filter(Boolean).length <= 2;
}

async function loadAtlasFiles(files, sourceLabel) {
  const loaded = [];
  const loadedNames = [];
  for (const file of files) {
    if (!/\.png$/i.test(file.name) || !isTopLevelAtlasFile(file)) continue;
    try {
      const img = await loadImageFromFile(file);
      if (img.width !== 256 || img.height !== 256) continue;
      const fileName = tilesetFileFromName(file.name);
      loaded.push([tilesetNameFromFile(fileName), img]);
      loadedNames.push(fileName);
    } catch (e) {
      console.warn('[palette-editor] skipped atlas file:', file.name, e);
    }
  }

  if (loaded.length === 0) {
    status('No 256x256 PNG tilesets found in ' + sourceLabel, false);
    return false;
  }

  for (const [name, img] of loaded) wallTilesetCache.set(name, img);
  wallTilesetOptions = sortTilesetFiles(loadedNames);
  populateWallTilesetSelect();
  await selectWallTileset(preferredWallTilesetName(), { quiet: true });
  status('Loaded ' + loaded.length + ' WALL tileset(s) from ' + sourceLabel, true);
  return true;
}

async function loadAtlasDirectory() {
  document.getElementById('atlasDirInput').click();
}

async function reloadFromDisk() {
  if (location.protocol === 'file:') {
    status('file:// uses embedded ItemStratum_Level_34; use Load LDtk/Load Atlas PNGs to override', true);
    if (csvEntries.length > 0) renderPreview();
    return;
  }
  const text = await tryFetchCsvFromDisk(true);
  let csvLoaded = false;
  let tilesetsLoaded = 0;
  if (text) {
    loadCSV(text);
    saveCSVToStorage(text);
    csvLoaded = true;
    tilesetsLoaded = await autoLoadWallTilesetFromDisk();
  }
  const ldtkText = await tryFetchLdtkFromDisk(true);
  const ldtkLoaded = ldtkText ? loadLdtk(ldtkText, 'disk') : false;
  if (!csvLoaded && !ldtkLoaded) {
    status('Reload failed: disk fetch unavailable (file:// needs Load CSV/Load LDtk or dev server)', false);
    return;
  }
  status('Reloaded from disk (' +
    (csvLoaded ? csvEntries.length + ' entries, ' + tilesetsLoaded + ' wall tilesets' : 'CSV unavailable') +
    ', ' + (ldtkLoaded ? ldtkPreviewMaps.length + ' LDtk levels' : 'LDtk unavailable') + ')', true);
  if (csvEntries.length > 0) renderPreview();
}

async function initEditor() {
  populateWallTilesetSelect();
  populateLevelSelect();
  await loadEmbeddedWallTilesets();
  // 1. Try disk first (dev server)
  const diskCsv = await tryFetchCsvFromDisk(false);
  if (diskCsv) {
    loadCSV(diskCsv);
    saveCSVToStorage(diskCsv);
    const tilesetsLoaded = await autoLoadWallTilesetFromDisk();
    status('Auto-loaded from disk (' + csvEntries.length + ' entries, ' + tilesetsLoaded + ' wall tilesets)', true);
    if (csvEntries.length > 0) renderPreview();
  } else {
    // 2. Fallback: localStorage
    await restoreFromStorage();
  }
  const diskLdtk = await tryFetchLdtkFromDisk(false);
  if (diskLdtk) loadLdtk(diskLdtk, 'disk');
}

// ── File handlers ──
document.getElementById('csvInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  file.text().then(text => { loadCSV(text); saveCSVToStorage(text); });
});
document.getElementById('atlasDirInput').addEventListener('change', e => {
  const files = Array.from(e.target.files || []);
  if (files.length === 0) return;
  loadAtlasFiles(files, 'selected atlas files');
});
document.getElementById('ldtkInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  file.text().then(text => loadLdtk(text, file.name));
});

// ── Drag & drop ──
const dropOverlay = document.getElementById('dropOverlay');
document.addEventListener('dragover', e => { e.preventDefault(); dropOverlay.classList.add('active'); });
document.addEventListener('dragleave', e => { if (e.target === dropOverlay) dropOverlay.classList.remove('active'); });
document.addEventListener('drop', e => {
  e.preventDefault(); dropOverlay.classList.remove('active');
  const file = e.dataTransfer.files[0];
  if (file && file.name.endsWith('.csv')) {
    file.text().then(text => { loadCSV(text); saveCSVToStorage(text); });
  } else if (file && (file.name.endsWith('.ldtk') || file.name.endsWith('.json'))) {
    file.text().then(text => loadLdtk(text, file.name));
  } else {
    const pngFiles = Array.from(e.dataTransfer.files || []).filter(f => /\.png$/i.test(f.name));
    if (pngFiles.length > 0) loadAtlasFiles(pngFiles, 'dropped PNGs');
  }
});

// ── Auto-restore on load (disk first, localStorage fallback) ──
initEditor();
</script>
