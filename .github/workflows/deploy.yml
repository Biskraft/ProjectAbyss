name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: game
        run: npm install

      - name: Generate i18n locale bundles
        run: node Sheets/tools/csv_to_locale.mjs

      - name: Validate CSV integrity
        run: node Sheets/tools/validate.mjs

      - name: Type check
        working-directory: game
        run: npx tsc --noEmit

      # Channel mapping (System_Localization_Core.md §4.7):
      #   echoris.io/play/ = Vertical Slice (frozen, vertical-slice branch) — public demo
      #   echoris.io/main/ = Current build (main, EN) — latest dev
      #   echoris.io/ko/   = Current build (KO, KR test channel)
      - name: Build game (current main, EN → /main/)
        working-directory: game
        run: npx vite build --mode en --base /main/

      - name: Build game (current main, KO → /ko/)
        working-directory: game
        run: npx vite build --mode ko --outDir dist-ko --base /ko/

      - name: Build vertical slice (frozen → /play/) from vertical-slice branch
        run: |
          git fetch origin vertical-slice:vertical-slice
          git worktree add ../slice vertical-slice
          cd ../slice/game
          npm install
          npx vite build --mode en --base /play/

      - name: Assemble site
        run: |
          mkdir -p site/play site/main site/ko
          cp -r ../slice/game/dist/* site/play/
          cp -r game/dist/* site/main/
          cp -r game/dist-ko/* site/ko/
          cp website/index.html site/
          cp -r website/assets site/
          cp website/assets/favicon.ico site/favicon.ico
          cp game/public/CNAME site/

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
