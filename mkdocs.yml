site_name: Level Design Architecture Notes
site_description: Game systems architecture patterns and level design references
docs_dir: Documents

# 아카이브·기밀·내부 노트는 빌드/사이트에서 제외 (MkDocs 1.5+ exclude_docs).
# 자동 nav 가 Documents/ 전체를 노출하므로 민감 문서를 반드시 제외한다.
exclude_docs: |
  **/_archive/**
  **/_Archive/**
  Content/Content_Victor_LifeLog_Synthesis.md
  **/*LifeLog*
  **/*Victor_LifeLog*
  Plan/marketing/**
  **/.steamworks_session/**
  **/playtest-links.md

# nav 미지정 → Documents/ 트리에서 자동 생성.
# 매 배포마다 현재 문서를 자동 반영한다(수동 nav 드리프트 제거). 정렬은 폴더/파일명 순.

theme:
  name: material
  palette:
    scheme: default
    primary: indigo
    accent: indigo
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      line_anchors: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
